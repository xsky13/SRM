name: CI/CD Pipeline - Build, SonarQube & Deploy

on:
  push:
    branches: [ deploy, main ]
  pull_request:
    branches: [ deploy, main ]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@395130dfe0279e701a590c29f636224403823793 # v4.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Generate Build Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      - name: Set up Java (Required for SonarScanner)
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006b32cccd1051e # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarQube packages
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772145be0bf # v4.2.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"xsky13_SRM" \
            /o:"xsky13" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project with Version Tag
        run: dotnet build --configuration Release --no-restore -p:Version=${{ env.BUILD_VERSION }}

      - name: Run Tests with Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # --- DOCKER BUILD & PUSH (Pinned SHAs) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51f6e0c1643c2c5abe1161208e333250f2b # v3.1.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels) for Docker
        id: meta
        uses: docker/metadata-action@986681442c2d6139c8949f538350171fb7f10baf # v5.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.BUILD_VERSION }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@48bab3dd42511416963e8bf5fb6530c308354b71 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/deploy' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
