name: CI/CD Pipeline - Build, SonarQube & Deploy

on:
  push:
    branches: [ deploy, main ]
  pull_request:
    branches: [ deploy, main ]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Build Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      - name: Set up Java (Required for SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"xsky13_SRM" \
            /o:"xsky13" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project with Version Tag
        run: dotnet build --configuration Release --no-restore -p:Version=${{ env.BUILD_VERSION }}

      - name: Run Tests with Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # --- 4. DEPLOYMENT STEP ---
      - name: Publish Artifacts
        run: dotnet publish --configuration Release --output ./publish -p:Version=${{ env.BUILD_VERSION }}

      - name: Deploy to Server / Environment
        if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
        run: |
          echo "Executing deployment steps for production/staging server..."
          # Add your deployment commands here (e.g., SSH deployment, FTP, or cloud provider CLI)
          echo "Successfully deployed version ${{ env.BUILD_VERSION }}"
