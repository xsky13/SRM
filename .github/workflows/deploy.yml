name: CI/CD Pipeline - Build, SonarQube & Deploy

on:
  push:
    branches: [deploy, main]
  pull_request:
    branches: [deploy, main]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Repository # downloads repo to vm 
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Necessary for SonarQube to get proper analysis of history

      - name: Setup .NET SDK # intall .net on the machine 
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # --- 1. VERSION MANAGEMENT ---
      - name: Generate Build Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      # --- 2. SONARQUBE ANALYSIS ---
      - name: Set up Java (Required for SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_MAIL: ${{ secrets.ADMIN_MAIL }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"xsky13_SRM" \
            /o:"xsky13" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      # --- 3. BUILD & TEST ---
      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project with Version Tag
        run: dotnet build --configuration Release --no-restore -p:Version=${{ env.BUILD_VERSION }}

      - name: Run Tests with Coverage
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_MAIL: ${{ secrets.ADMIN_MAIL }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # --- 4. DEPLOY CONTAINER (deploy branch only, self-hosted runner) ---
  deploy:
    needs: build-and-analyze
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # WriteAllText avoids the BOM that Set-Content adds in Windows PowerShell
          [System.IO.File]::WriteAllText((Join-Path $PWD ".env"), $env:ENV_FILE)

      - name: Build and Start Containers
        run: |
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image prune -f
  
  release:
    needs: deploy
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.0.${{ github.run_number }}" \
            --generate-notes

  publish-image:
    needs: deploy
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and Push Image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # GHCR requires a lowercase image name
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          docker build \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" .

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"